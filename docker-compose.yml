services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recall-qdrant
    ports:
      - "6333:6333"  # REST / HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Optional: the FastAPI trace viewer. Enable once Phase 6 is built.
  # recall-api:
